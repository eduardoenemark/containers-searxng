# SearXNG — Serviço Dedicado de Busca Privada
# Versão: 2026.06.27
# Engines configurados: 55+
#
# Start:
#   ./startup.sh                # Start automático (recomendado)
#   docker compose up -d        # Iniciar manualmente
#   docker compose down         # Parar
#   docker compose logs -f      # Logs ao vivo
version: "3.9"
services:
  searxng:
    image: docker.io/searxng/searxng:2026.7.3-747cec4c2
    container_name: searxng
    restart: always
    ports:
      - "${SEARXNG_PORT:-8888}:8888"
    env_file:
      - .env
    volumes:
      - ./config/settings-full.yml:/etc/searxng/settings.yml:ro,Z
      - ./config/limiter.toml:/etc/searxng/limiter.toml:ro,Z
      - ./data/searxng-data:/var/lib/searxng
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/').read()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - searxng-net

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: searxng-valkey
    restart: always
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - ./data/valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - searxng-net

volumes:
  searxng-data:
    driver: local
  valkey-data:
    driver: local

networks:
  searxng-net:
    driver: bridge
