version: "3.9"

services:
  valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: searxng-valkey
    depends_on:
      - valkey
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - data/valkey-data:/data   # will be created by the helper service

  script:
    image: docker.io/alpine:3.23.5 # any tiny image with `mkdir` and `sh`
    container_name: script
    entrypoint: ["/bin/sh", "-c"]
    command: |
      mkdir -p /data && \
      echo "Host directory ready" && \
      sleep infinity   # keep the container alive so valkey can depend on it


