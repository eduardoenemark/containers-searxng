version: "3.9"
# SearXNG — Dedicated Private Search Service
services:
  valkey:
    image: docker.io/valkey/valkey:9-alpine3.24
    container_name: valkey
    restart: always
    volumes:
      - ./data-valkey:/data
    healthcheck:
      test: ["CMD","valkey-cli -p 6379 ping | grep PONG"]
      interval: 5s
      timeout: 1s
      retries: 5
      start_period: 3s
    networks:
      - searxng-net
  searxng:
    image: docker.io/searxng/searxng:2026.7.24-4f64d9501
    container_name: searxng
    restart: always
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - ./config/settings-full.yml:/etc/searxng/settings.yml:ro,Z
      - ./config/limiter.toml:/etc/searxng/limiter.toml:ro,Z
      - ./config/ip_limit.py:/usr/local/searxng/searx/botdetection/ip_limit.py:ro,Z
      - ./data-searxng:/var/lib/searxng
    environment:
      - SEARXNG_BURST_WINDOW=20
      - SEARXNG_BURST_MAX=20
      - SEARXNG_BURST_MAX_SUSPICIOUS=5
      - SEARXNG_LONG_WINDOW=60
      - SEARXNG_LONG_MAX=30
      - SEARXNG_LONG_MAX_SUSPICIOUS=15
      - SEARXNG_API_WINDOW=60
      - SEARXNG_API_MAX=20
      - SEARXNG_SUSPICIOUS_IP_WINDOW=60
      - SEARXNG_SUSPICIOUS_IP_MAX=3
    networks:
      - searxng-net

  nginx:
    image: docker.io/nginx:stable-alpine3.24-perl 
    container_name: nginx
    restart: always
    ports:
      - 8888:80
      - 443:443
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      searxng:
        condition: service_started
    networks:
      - searxng-net

networks:
  searxng-net:
    driver: bridge

